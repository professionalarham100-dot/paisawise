  <text x="340" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#0a0a0a" style="fill: var(--color-text-primary);fill:rgb(250, 249, 245);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, sans-serif;font-size:28px;font-weight:600;text-anchor:middle;dominant-baseline:auto">PaisaWise</text>
  <text x="340" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="#888" style="fill:rgb(136, 136, 136);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, sans-serif;font-size:14px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Your money, clearly.</text>

