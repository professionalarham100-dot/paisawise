    <line x1="190" y1="60" x2="490" y2="60" stroke="#00ff88" stroke-width="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(0, 255, 136);color:rgb(255, 255, 255);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <line x1="190" y1="110" x2="490" y2="110" stroke="#00ff88" stroke-width="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(0, 255, 136);color:rgb(255, 255, 255);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
